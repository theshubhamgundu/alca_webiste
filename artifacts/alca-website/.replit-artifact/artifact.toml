kind = "web"
previewPath = "/"
title = "ALCA Website"
description = "ALCA's mobile-first business website with product browsing, WhatsApp ordering and enquiries, event quoting, gift hampers, and service information."
version = "1.0.0"
id = "artifacts/alca-website"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21787

[services.development]
run = "pnpm --filter @workspace/alca-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/alca-website", "run", "build" ]
serve = "static"
publicDir = "artifacts/alca-website/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21787"
BASE_PATH = "/"
